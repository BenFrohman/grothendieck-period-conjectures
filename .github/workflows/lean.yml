name: Lean CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lean-version: "v4.36.0"
          build-args: ""
      - name: Print axioms
        run: |
          lake env lean --run -e "#print axioms GrothendieckPeriod.cycle_iff_rational_periods"
