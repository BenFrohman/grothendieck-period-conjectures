name: Lean CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lean-version: "v4.36.0"
          build-args: ""
      - name: Axiom verification
        run: lake env lean GrothendieckPeriod/AxiomCheck.lean
